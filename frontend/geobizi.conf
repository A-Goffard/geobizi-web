server {
    listen 80;
    server_name geobizi.com www.geobizi.com;

    root /usr/share/nginx/html;
    index index.html;

    # Permite subir fotos de hasta 10 MB desde el panel
    client_max_body_size 10M;

    # 1. Panel de administración (anti-indexación y sin caché)
    location /admingestion {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 2. API: reenvía al backend
    location /api/ {
        proxy_pass http://python_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Imágenes subidas (^~ evita que lo capture la regla de assets)
    location ^~ /uploads/ {
        proxy_pass http://python_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Assets estáticos con caché de 1 año
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # 5. SPA de Vue
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}