server {
    listen 80;
    server_name geobizi.com www.geobizi.com;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Regla para el panel de administración (Anti-indexación y sin caché)
    location /admingestion {
        add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # 2. Assets estáticos (js, css, imágenes y webp) con caché de 1 año
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Servir imágenes subidas desde el backend
    location /uploads/ {
        proxy_pass http://python_backend:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Regla general para la SPA de Vue (unificada)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }
}
