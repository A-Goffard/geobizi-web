services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: vue_frontend
    ports:
      - "127.0.0.1:8080:80"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: python_backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - /opt/geobizi/data:/app/data
      - /opt/geobizi/uploads:/app/uploads
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/geobizi.db